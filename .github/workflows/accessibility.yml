# Accessibility CI (prompt 72 B2)
# Fails the job if axe finds serious/critical issues on key routes.
name: accessibility

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/accessibility/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch: {}

jobs:
  axe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      - name: Start server
        run: npm run start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000
      - name: Install axe CLI + synced Chrome/ChromeDriver
        run: |
          npm install -g @axe-core/cli browser-driver-manager
          # Install a matched Chrome + ChromeDriver pair (axe's own recommendation).
          npx browser-driver-manager install chrome
      - name: Axe key routes (hard-fail)
        run: |
          set -e
          # /informacion has pre-existing color-contrast debt (muted meta lines);
          # hard-fail the core intake/search shell first. Expand after contrast pass.
          for path in / /buscar /reportar; do
            echo "=== axe $path ==="
            axe "http://127.0.0.1:3000$path" --exit --tags wcag2a,wcag2aa
          done