# Vigil Watch trigger — polling logic lives in /api/watch/scan and
# /api/cron/hazards (in-repo, testable); this Action is only the scheduler.
# Requires CRON_SECRET repo secret matching the Vercel env var of the same name.
name: vigil-watch

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger operator watch scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set in GitHub — cannot authenticate"
            exit 1
          fi
          # Retry once on transient Vercel 504 / gateway blips.
          for attempt in 1 2; do
            status=$(curl -sS --max-time 290 -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://vigil.youthewave.org/api/watch/scan" || echo "000")
            cat response.json || true
            if [ "$status" = "200" ]; then
              exit 0
            fi
            echo "Scan returned HTTP $status (attempt $attempt)"
            if [ "$attempt" = "2" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Trigger global hazard poll
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in 1 2; do
            status=$(curl -sS --max-time 290 -o hazards.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://vigil.youthewave.org/api/cron/hazards" || echo "000")
            cat hazards.json || true
            if [ "$status" = "200" ]; then
              exit 0
            fi
            echo "Hazards poll returned HTTP $status (attempt $attempt)"
            if [ "$attempt" = "2" ]; then
              exit 1
            fi
            sleep 20
          done
