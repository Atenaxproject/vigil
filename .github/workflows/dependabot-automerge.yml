name: Dependabot auto-merge

# Auto-merges Dependabot PRs only when every update in the PR is patch-level
# (never minor/major) and only after branch protection's required checks
# (build, CodeQL) report green on this PR. Grouped patch PRs come from the
# "patch-updates" group in dependabot.yml; ungrouped minor/major bumps never
# match update-type == patch below and always wait for manual review.
#
# pull_request_target (not pull_request) is required here: Dependabot PRs
# run pull_request-triggered workflows with a read-only token, which can't
# approve or merge. pull_request_target runs with the workflow file from the
# base branch and a token with normal write permissions instead.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # No approval step: the repo's branch ruleset requires 0 approving
      # reviews by default, and this repo has "Allow GitHub Actions to
      # approve pull requests" disabled (can_approve_pull_request_reviews:
      # false) — an approve call here would just fail. Enabling auto-merge
      # is enough; the ruleset's required status checks (build, CodeQL) are
      # what actually gate the merge.
      - name: Enable auto-merge (patch-only)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
