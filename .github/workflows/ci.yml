name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No path filters: a required check that never reports on a skipped PR blocks
# that PR forever. This runs on every PR to main, docs-only changes included.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Offline fixture / sanitizer / deployment-pack guards — no secrets, no network.
      - run: node scripts/test-sanitize.mjs
      - run: node scripts/test-feeds.mjs
      - run: node scripts/test-rate-limit.mjs
      - run: node scripts/validate-deployments.mjs
      # Vitest unit tests (circuit breaker, contested figures, sanitize, content-expiry)
      - run: npm test
      # `npm run build` runs the prebuild i18n-parity gate, so key drift fails CI too.
      # The app is designed to build without secrets (no Supabase/Anthropic keys needed).
      - run: npm run build
      # Playwright smoke: optional hard run when PLAYWRIGHT=1 (not required for merge).
      - name: Playwright smoke (optional)
        if: env.PLAYWRIGHT == '1'
        env:
          PLAYWRIGHT: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          npx playwright test
