# Public-route synthetic uptime — no secrets required for page probes.
# Public pages only; maintenance endpoints must never be used as probes.
name: synthetic-uptime

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe public routes
        env:
          BASE_URL: https://vigil.youthewave.org
        run: node scripts/synthetic-uptime.mjs
